name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        run: unzip -q demo-master-android.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Установить зависимости
        working-directory: demo-master-android
        run: npm ci
      - name: Обновить Android-проект
        working-directory: demo-master-android
        run: npx cap sync android
      - name: Собрать APK
        working-directory: demo-master-android/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: demo-master-apk
          path: demo-master-android/android/app/build/outputs/apk/debug/app-debug.apk
